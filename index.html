
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unick Auto Detailing | Elite Miami Mobile Concierge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFB84D;
            --gold-shimmer: linear-gradient(90deg, #FFB84D 0%, #FFF3D4 50%, #FFB84D 100%);
            --deep-space: #0A1628;
            --miami-cyan: #00E5FF;
            --platinum: #F8F9FA;
            --success: #10B981;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--deep-space);
            color: var(--platinum);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
        }
        .text-gold { color: var(--gold); }
        .bg-gold { background-color: var(--gold); }
        .border-gold { border-color: var(--gold); }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .liquid-gold-btn {
            background: var(--gold);
            color: var(--deep-space);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }
        .liquid-gold-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 184, 77, 0.3);
        }
        
        .kinetic-reveal {
            opacity: 0;
            transform: translateY(30px);
            animation: kinetic 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes kinetic {
            to { opacity: 1; transform: translateY(0); }
        }

        .shimmer-text {
            background: var(--gold-shimmer);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
        }
        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .gradient-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(at 0% 0%, hsla(215, 60%, 15%, 1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(215, 30%, 10%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(185, 100%, 50%, 0.1) 0, transparent 50%);
            z-index: -1;
        }

        /* Thumb-zone optimization for mobile */
        .mobile-fab {
            bottom: 1.5rem;
            right: 1.5rem;
            box-shadow: 0 15px 35px rgba(255, 184, 77, 0.4);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
